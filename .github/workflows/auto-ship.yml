name: Auto Ship Approved Skill Updates

on:
  pull_request_review:
    types:
      - submitted

permissions: {}

jobs:
  ship:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: webmaxru/ai-native-dev/.github/workflows/reusable-skill-ship.yml@main
    with:
      hub_ref: main
      merge_method: squash
      release_workflow: release.yml
