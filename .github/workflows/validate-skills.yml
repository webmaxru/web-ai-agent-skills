name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/plugin.json"
      - ".github/plugin/plugin.json"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".claude-plugin/plugin.json"
      - ".github/plugin/plugin.json"
      - "package.json"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: read
    uses: webmaxru/ai-native-dev/.github/workflows/reusable-skill-validate.yml@cc1388ab79a680fec0607e9d27f0226c440ece45
    with:
      hub_ref: cc1388ab79a680fec0607e9d27f0226c440ece45
