name: Weekly Skill Updates

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      prompt_path:
        description: Optional single prompt path under .github/prompts/ ending in -skill-update.prompt.md
        required: false
        type: string

permissions: {}

concurrency:
  group: weekly-skill-updates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover-prompts:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      prompt_paths: ${{ steps.discover.outputs.prompt_paths }}
      prompt_count: ${{ steps.discover.outputs.prompt_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: discover
        name: Discover saved skill-update prompts
        env:
          REQUESTED_PROMPT: ${{ inputs.prompt_path }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');

          const promptsDir = path.join(process.cwd(), '.github', 'prompts');
          const requestedPrompt = (process.env.REQUESTED_PROMPT || '').trim();

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          if (!fs.existsSync(promptsDir)) {
            fail('Missing .github/prompts directory.');
          }

          const allPromptPaths = fs
            .readdirSync(promptsDir, { withFileTypes: true })
            .filter((entry) => entry.isFile() && entry.name.endsWith('-skill-update.prompt.md'))
            .map((entry) => `.github/prompts/${entry.name}`)
            .sort();

          let selectedPromptPaths = allPromptPaths;
          if (requestedPrompt) {
            if (!requestedPrompt.startsWith('.github/prompts/') || !requestedPrompt.endsWith('-skill-update.prompt.md')) {
              fail('prompt_path must be under .github/prompts/ and end with -skill-update.prompt.md');
            }
            if (!allPromptPaths.includes(requestedPrompt)) {
              fail(`Requested prompt not found: ${requestedPrompt}`);
            }
            selectedPromptPaths = [requestedPrompt];
          }

          process.stdout.write(`prompt_paths=${JSON.stringify(selectedPromptPaths)}\n`);
          process.stdout.write(`prompt_count=${selectedPromptPaths.length}\n`);
          NODE

  run-skill-update-prompts:
    needs: discover-prompts
    if: needs.discover-prompts.outputs.prompt_count != '0'
    strategy:
      fail-fast: false
      matrix:
        prompt_path: ${{ fromJson(needs.discover-prompts.outputs.prompt_paths) }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: webmaxru/ai-native-dev/.github/workflows/skill-update-worker.lock.yml@webmaxru-automation-weekly-update-fix
    with:
      prompt_path: ${{ matrix.prompt_path }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}

  supersede-skill-update-pull-requests:
    needs:
      - discover-prompts
      - run-skill-update-prompts
    if: always() && needs.discover-prompts.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: webmaxru/ai-native-dev/.github/workflows/reusable-skill-update-supersede.yml@webmaxru-automation-weekly-update-fix

  report-skill-update-failure:
    needs:
      - discover-prompts
      - run-skill-update-prompts
      - supersede-skill-update-pull-requests
    if: >-
      always() &&
      (needs.discover-prompts.result == 'failure' ||
       needs.run-skill-update-prompts.result == 'failure' ||
       needs.supersede-skill-update-pull-requests.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update the weekly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '[skill-update] failed weekly skill updates';
            const marker = '<!-- skill-update-failure -->';
            const { owner, repo } = context.repo;
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const failures = Object.entries(needs)
              .filter(([, job]) => job.result === 'failure')
              .map(([name]) => `- \`${name}\` failed`);
            const body = [
              marker,
              'The weekly skill-update workflow failed.',
              '',
              `Run: ${process.env.RUN_URL}`,
              '',
              'Failed jobs:',
              ...failures,
            ].join('\n');
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const prior = openIssues.find((issue) =>
              !issue.pull_request && issue.title === title && issue.body?.includes(marker)
            );

            if (prior) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: prior.number,
                body,
              });
              core.info(`Updated deduplicated skill-update failure issue #${prior.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.info(`Created skill-update failure issue #${issue.number}.`);
            }